name: PSScriptAnalyzer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint PowerShell scripts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost
          if ($results) {
              $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize |
                  Out-String -Width 220 | Write-Host
              throw "PSScriptAnalyzer reported $($results.Count) issue(s)."
          }
          Write-Host "No issues found."
